<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votre accès - Vendeur Digital 360</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .box {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .check {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
    }

    p {
      color: #5d6675;
      line-height: 1.6;
      font-size: 16px;
    }

    .download {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 25px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 17px;
    }

    .download:hover {
      background: #12813b;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #7a8494;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="check">🎉</div>

    <h1>Félicitations !</h1>

    <p>
      Votre paiement a été effectué avec succès.
      <br><br>
      Votre <strong>Vendeur Digital 360</strong> est maintenant disponible.
    </p>

    <a class="download" href="./Vendeur_Digital_360.pdf" target="_blank">
      📘 ACCÉDER À MON GUIDE
    </a>

    <p class="note">
      Cliquez sur le bouton ci-dessus pour ouvrir votre guide.
    </p>

  </div>

</body>
</html>
