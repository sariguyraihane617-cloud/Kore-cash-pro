<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kore Official Cash Pro</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; }
    body {
      background: #09695f;
      color: #075f57;
      padding: 24px 40px 80px;
    }
    .card {
      width: 100%;
      max-width: 670px;
      margin: 0 auto;
      background: #fff;
      border-radius: 24px;
      padding: 68px 50px 48px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 48px;
      line-height: 1.25;
      font-weight: 700;
      color: #075f57;
    }
    .diamond { font-size: 40px; vertical-align: 4px; margin-right: 8px; }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 28px;
      margin: 28px 0 58px;
    }
    form { display: grid; gap: 32px; }
    input, select {
      width: 100%;
      height: 88px;
      border: 2px solid #ddd;
      border-radius: 16px;
      padding: 0 24px;
      font-size: 29px;
      font-weight: 600;
      color: #333;
      background: #fff;
      outline: none;
    }
    input::placeholder { color: #aaa; opacity: 1; }
    select {
      color: #0879ed;
      background: #eee;
      border-color: #ddd;
      font-weight: 700;
    }
    .warning {
      background: #fde8ed;
      color: #e52b2b;
      border-radius: 13px;
      padding: 24px 20px;
      font-size: 22px;
      line-height: 1.35;
    }
    button {
      height: 96px;
      border: 0;
      border-radius: 16px;
      background: #20d463;
      color: white;
      font-size: 30px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(.99); }
    .footer {
      max-width: 670px;
      margin: 0 auto;
      padding-top: 142px;
      text-align: center;
      color: white;
      font-size: 27px;
      font-weight: 700;
    }
    @media (max-width: 600px) {
      body { padding: 0 40px 50px; }
      .card { padding: 96px 50px 48px; border-radius: 24px; }
      h1 { font-size: 47px; }
      .subtitle { font-size: 28px; margin-bottom: 58px; }
      input, select { height: 89px; font-size: 29px; }
      .warning { font-size: 21px; }
      button { font-size: 29px; }
      .footer { padding-top: 145px; font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1><span class="diamond">💎</span>Kore Official Cash<br>Pro</h1>
    <div class="subtitle">Demande de Transfert International</div>

    <form id="transferForm">
      <input type="text" name="name" placeholder="Nom complet" autocomplete="name" required>
      <input type="text" name="account" placeholder="Numéro de compte Kore Official" required>
      <input type="text" name="country" placeholder="Pays de destination" required>
      <input type="tel" name="whatsapp" placeholder="Votre numéro WhatsApp" autocomplete="tel" required>

      <select name="network" required>
        <option value="">-- Choisir le réseau --</option>
        <option>MTN</option>
        <option>Moov</option>
        <option>Orange</option>
        <option>Wave</option>
        <option>Airtel</option>
      </select>

      <input type="number" name="amount" placeholder="Montant à transférer XAF" min="1" required>

      <div class="warning">
        ⚠️ Pour votre sécurité : Ne donnez jamais votre code secret, NIP ou code de retrait ici.
        Un agent officiel vous contactera pour la suite.
      </div>

      <button type="submit">Envoyer au Service</button>
    </form>
  </main>

  <div class="footer">moudachirou.github.io</div>

  <script>
    document.getElementById("transferForm").addEventListener("submit", function(e) {
      e.preventDefault();

      // Numéro WhatsApp béninois : +229 01 69 64 90 01
      const whatsappNumber = "2290169649001";

      // Message simple : aucune donnée secrète ou code PIN n'est transmis.
      const message =
        "Bonjour, je viens de remplir une demande de transfert international sur Kore Official Cash Pro. " +
        "Je souhaite être contacté pour la suite.";

      const whatsappUrl =
        "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(message);

      window.location.href = whatsappUrl;
    });
  </script>
</body>
</html>
